<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố Cục 3 Cột & Bootstrap Components</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.5.2 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Bước 1: Cấu trúc Grid với 3 cột kết hợp Flexbox -->
    <div class="container mt-5">
        <div class="row g-3">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded">
                <p class="mb-0 fw-bold">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white rounded">
                <p class="mb-0 fw-bold">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded">
                <p class="mb-0 fw-bold">Phần 3</p>
            </div>
        </div>
    </div>

    <!-- Bước 2: Áp dụng Margin & Padding để điều chỉnh khoảng cách -->
    <div class="container my-5 py-3 bg-white shadow-sm rounded">
        <h3 class="text-center mb-0">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </div>

    <!-- Bước 3: Sử dụng Display Property để hiển thị ẩn hiện nội dung -->
    <div class="container">
        <div class="d-none d-md-block bg-warning text-center p-3 rounded text-dark fw-semibold">
            <p class="mb-0">Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px</p>
        </div>
    </div>

    <!-- Bước 4: Tạo Carousel (Slideshow hình ảnh) -->
    <div class="container">
        <div id="myCarousel" class="carousel slide mt-5 shadow rounded overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/1200/400?random=1" class="d-block w-100" alt="Hình ảnh 1" style="height: 400px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?random=2" class="d-block w-100" alt="Hình ảnh 2" style="height: 400px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?random=3" class="d-block w-100" alt="Hình ảnh 3" style="height: 400px; object-fit: cover;">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <!-- Bước 5: Sử dụng Font Awesome trong tiêu đề và nút bấm -->
    <div class="container mt-5">
        <h3>
            <i class="fas fa-home text-primary"></i>
            Trang chủ
        </h3>
    </div>

    <!-- Bước 6: Tạo Form liên hệ với Bootstrap Form -->
    <div class="container my-5" style="max-width: 650px;">
        <div class="card shadow-sm border-0 p-4">
            <h4 class="mb-4 fw-bold text-center">Biểu mẫu liên hệ</h4>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Họ và tên</label>
                    <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label fw-semibold">Nội dung</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung" required></textarea>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane me-1"></i> Gửi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 Layout Practice. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5.3 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
